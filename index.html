    <title>Yesrasew</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#001b3a', // Deep Navy from logo
                        accent: '#d4af37',  // Metallic Gold from logo
                        'accent-light': '#f4e3b1',
                        'primary-dark': '#00142b',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Ethiopic:wght@300;400;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans Ethiopic', sans-serif; }
        
        /* Custom gold gradient utility */
        .gold-gradient {
            background: linear-gradient(135deg, #d4af37 0%, #f4e3b1 50%, #d4af37 100%);
        }
        .text-gold-gradient {
            background: linear-gradient(135deg, #d4af37 0%, #f4e3b1 50%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Quill Custom Styles */
        .ql-toolbar.ql-snow {
            border: none !important;
            background: #f9fafb;
            border-bottom: 1px solid #f3f4f6 !important;
            border-top-left-radius: 1.5rem;
            border-top-right-radius: 1.5rem;
            padding: 12px 20px !important;
        }
        .ql-container.ql-snow {
            border: none !important;
            font-family: 'Inter', sans-serif !important;
            font-size: 14px !important;
        }
        .ql-editor {
            min-height: 200px;
            padding: 20px !important;
            font-weight: 500;
            color: #001b3a;
        }
        .ql-editor.ql-blank::before {
            color: #9ca3af !important;
            font-style: normal !important;
            left: 20px !important;
        }
        .quill-wrapper {
            transition: all 0.2s;
        }
        .quill-wrapper:focus-within {
            background: white !important;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.05);
            border-color: #d4af37 !important;
        }
    </style>
